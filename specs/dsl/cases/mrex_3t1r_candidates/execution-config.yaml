# yaml-language-server: $schema=../../../schema/execution-config.schema.yaml
# mrex_3t1r_candidates 执行配置 — 3T1R 全任务空间模式（two-leg 候选装配）
#
# 候选拓扑：platform_frame 为中央平台（承载 tool_1），两条 growth 支链分别把
# joint_1 / joint_2 的 linkB 接到平台 faceYMinus / faceXMinus；两个内部转动
# 关节 joint_1.q / joint_2.q 移入 unknown，形成 8 未知量 / 12 分量的完整闭环
# 系统。释放内部关节后 tip 任务子空间 = 3 平移 ⊕ 绕 Y 转动（闭链流形维数 = 4）。
#
# 本文件只规定 L3 执行语义（世界绑定 / 切口 / 变量分区 / 容差）。
# demo 运动轨迹（θ 纯 RCM 旋转：tip 固定在零位点，只绕该点转）【不在本文件】——它由
# tests/pipeline/test_animation_m_rex_3t1r_candidates.m 顶部参数区以闭式构造
# 生成，作为「任务输入」传入求解器/动画。
#
# world_binding 的 T 省略：由零位构型 FK 自动标定（solver.ClosureSolver）。

mode: closed_loop
endFrame: tool_1.tip_origin

# ---- L3 工具坐标系（tool_frame，A.5.1.5）----
# 世界系 ≡ 工具坐标系零位姿态；pipette tip（endFrame）零位姿态自动派生为
# U⁻¹ = Ry(−45°)。与 mrex-3t1r_001 / mrex-3t2r_v00 系列保持一致，便于评估
# 结果横向对比。删除/注释本块 → 回到历史行为：世界系 ≡ tip 零位（U = I₄）。
tool_frame:
  transform:
    rotation: { rpy: [0, 45deg, 0] }

world_binding:
  - ground: manipulator_1.ground
  - ground: manipulator_2.ground

closure_cuts:
  - near: manipulator_1.ground
    anchor: world
    components: [tx, ty, tz, rx, ry, rz]
  - near: manipulator_2.ground
    anchor: world
    components: [tx, ty, tz, rx, ry, rz]

known:
  - tool_1.tip_origin

unknown:
  - manipulator_1.dx
  - manipulator_1.dy
  - manipulator_1.dz
  - manipulator_2.dx
  - manipulator_2.dy
  - manipulator_2.dz
  - joint_1.q
  - joint_2.q

tolerances:
  translation_mm: 0.001
  rotation_rad: 0.001
