# yaml-language-server: $schema=../../../schema/execution-config.schema.yaml
# m-rex-3t1r 执行配置 — 3T1R 全任务空间模式（案例唯一配置）
#
# 两个内部转动关节 joint_1.q / joint_2.q 移入 unknown，形成 8 未知量 / 12 分量的
# 完整闭环系统；释放内部关节后机构获得完整 3T1R 能力（tip 任务子空间 =
# 3 平移 ⊕ 绕 X 转动；闭链流形维数 = 4）。
#
# 原 A.4b 的 6 未知量 3T 基线配置已于配置合并中移除；其 KNOWNVALUES 与方形
# 6×6 基线覆盖保留在 tests/pipeline/test_closure_solver_m_rex_3t1r.m 的 tmp
# fixture 中（2026-10-11）。
#
# 重要：本文件只规定 L3 执行语义（世界绑定 / 切口 / 变量分区 / 容差）。
# demo 运动轨迹（φ 扫描 + 圆形平移）【不在本文件】——它由
# tests/pipeline/test_animation_m_rex_3t1r.m 顶部参数区以闭式构造生成，
# 作为「任务输入」传入求解器/动画（与 single-closed-loop 测试内联轨迹同例）。
#
# world_binding 的 T 省略：由零位构型 FK 自动标定（solver.ClosureSolver）。

mode: closed_loop
endFrame: pipette.tip_origin

# ---- L3 工具坐标系（tool_frame，A.5.1.5）—— 本案例的参考声明 ----
# 声明后「世界系 ≡ 工具坐标系零位姿态」：工具系初始方向与世界系平行，
# pipette tip（endFrame）零位姿态自动派生为 U⁻¹ = Ry(−45°)（即设计例的
# "0,0,0,0,-45°,0"）。用户面目标位姿/位姿报告以工具系表达：
#   输入（左乘世界系增量）：solver.ClosureSolver.setToolTarget(Δ_tool)
#       ΔT_tip = U · Δ_tool · U⁻¹
#   输出：solver.ClosureSolver.evalToolPose(q)
#       D(q) = U⁻¹ · T_rootWorld(q) · U
# 其中 U = T_root←tool = T_root←endFrame · T_endFrame←tool；本案例 root = endFrame
# （pipette.tip_origin），故 U = T_endFrame←tool = Ry(45°)（工具系相对 tip 绕其
# y 轴 +45°）。角分量数值 = rad，"45deg" 为显式单位写法（schema §scalarOrAngle）；
# 要求 root→endFrame 位姿链无关节（本案例满足）。
# 删除/注释本块 → 回到历史行为：世界系 ≡ tip 零位（U = I₄）。语义详见
# specs/dsl/connection-semantics.md §6.5。
tool_frame:
  transform:
    rotation: { rpy: [0, 45deg, 0] }

world_binding:
  - ground: manipulator_L.ground
  - ground: manipulator_R.ground

closure_cuts:
  - near: manipulator_L.ground
    anchor: world
    components: [tx, ty, tz, rx, ry, rz]
  - near: manipulator_R.ground
    anchor: world
    components: [tx, ty, tz, rx, ry, rz]

known:
  - pipette.tip_origin

unknown:
  - manipulator_L.dx
  - manipulator_L.dy
  - manipulator_L.dz
  - manipulator_R.dx
  - manipulator_R.dy
  - manipulator_R.dz
  - joint_1.q
  - joint_2.q

tolerances:
  translation_mm: 0.001
  rotation_rad: 0.001
