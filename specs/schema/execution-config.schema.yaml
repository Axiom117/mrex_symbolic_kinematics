# L3 执行配置 schema（阶段 A.3.3；A.4b 扩展 world 锚定切口）
# Execution-config schema for the L3 execution layer.
#
# 这是 JSON Schema，用于校验 specs/dsl/cases/*/execution-config.yaml
# 中的执行层（Execution，L3）配置文件。schema 严格遵循
# ../modeling-conventions.md §2.4 与 ../conventions.yaml；凡冲突以约定文档为准。
#
# 执行配置定义：机构如何被固定、如何被驱动、求解方向（FK/IK）、
# 变量 known/unknown 分区。同一套机构本体（L2）可接入不同执行配置，
# 从而在开环 FK 与闭环 IK 之间切换。
#
# 以下跨文件语义由 +ir/ExecutionConfig.m 校验（Schema 无法表达）：
#   - endFrame / actuated_joints / known / unknown / closure_cuts 中所有
#     ref 必须在 symbolRegistry 中存在
#   - known ∪ unknown 必须完整覆盖所有 joint 变量（不重不漏）
#   - mode=open_loop 时 closure_cuts 与 world_binding 必须为空
#   - mode=closed_loop 时 actuated_joints 必须为空
#   - closure_cuts 中 far ref（L2 双 frame 切口）必须引用 exposed frame 或
#     ground frame，且须匹配 EdgeGraph 中的 closed_mate 边
#   - closure_cuts 中 anchor: world（L3 world 锚定切口）的 near 必须命中
#     world_binding 的某条 ground；binding 的 T 省略时由求解器零位自动标定
#   - tool_frame（L3 工具坐标系）：transform 相对 endFrame 定义；rpy / axis_angle
#     的角分量接受数值（按内部约定 = rad）或带显式单位的字符串（如 "45deg"、
#     "0.7854rad"），由 ExecutionConfig 归一化为 rad
#   - tool_frame 声明后“世界系 ≡ 工具坐标系零位姿态”；求解器要求 FK root→endFrame
#     位姿链无关节（刚性链），否则报错（solver:ClosureSolver:flexibleToolFrame）

title: ExecutionConfig
description: >-
  单台机构的 L3 执行层配置。指定求解模式（开环/闭环）、世界系绑定、
  变量分区（known/unknown）、末端输出坐标系与闭环切口位置。
type: object
additionalProperties: false

required:
  - mode
  - endFrame
  - known
  - unknown

# ---------------------------------------------------------------------------
# 复用定义
# ---------------------------------------------------------------------------
$defs:

  modeEnum:
    description: 求解模式。
    type: string
    enum:
      - open_loop
      - closed_loop

  portRef:
    description: >-
      实例限定帧引用 "<instance>.<frame>"。
      instance 为 lowerCamelCase/snake_case，frame 遵循模块定义命名规则。
    type: string
    pattern: "^[a-z][a-zA-Z0-9_]*\\.[a-zA-Z][a-zA-Z0-9_]*$"

  jointVarRef:
    description: >-
      实例限定关节变量引用 "<instance>.<variable>"。
      variable 为模块定义的关节变量名（如 q、dx、dy、dz）。
    type: string
    pattern: "^[a-z][a-zA-Z0-9_]*\\.[a-zA-Z][a-zA-Z0-9_]*$"

  homogenousMatrix:
    description: 4×4 齐次变换矩阵（行主序）。
    type: array
    minItems: 4
    maxItems: 4
    items:
      type: array
      minItems: 4
      maxItems: 4
      items:
        type: number

  worldBinding:
    description: 单个 ground frame 到 world 的静态标定偏移。
    type: object
    additionalProperties: false
    required:
      - ground
    properties:
      ground:
        description: 接地帧引用（如 manipulator_L.ground）。
        $ref: "#/$defs/portRef"
      T:
        description: >-
          4×4 齐次变换矩阵（静态标定偏移，行主序）。
          省略时由求解器在零位构型下自动标定：T = 全部关节处于零位时
          该 ground frame 沿 FK 传播得到的位姿。零位下末端效应器与
          世界原点重合，故该位姿即 ground frame 相对 world 的静态偏移。
        $ref: "#/$defs/homogenousMatrix"

  closureCut:
    description: >-
      单条闭环切口声明，两种形式之一（由 oneOf 强制互斥）：
      (1) L2 双 frame 切口：near/far 均为图内 frame，须匹配 closed_mate 边；
      (2) L3 world 锚定切口：声明 anchor: world，far 侧不引用图内 frame，
          取 near（ground frame）所对应 world_binding 的标定位姿。
    type: object
    additionalProperties: false
    required:
      - near
    oneOf:
      - required:
          - far
        not:
          required:
            - anchor
      - required:
          - anchor
        not:
          required:
            - far
    properties:
      near:
        description: >-
          切口近端帧引用。L2：切口的 socket 侧（生成树侧）；
          L3：被世界绑定的 ground frame（如 manipulator_L.ground）。
        $ref: "#/$defs/portRef"
      far:
        description: 切口远端帧引用（仅 L2 双 frame 切口；与 anchor 互斥）。
        $ref: "#/$defs/portRef"
      anchor:
        description: >-
          L3 world 锚定切口标记（与 far 互斥）。当前仅支持 "world"：
          far 侧取 near 所对应 world_binding 的标定位姿。
          残差构造时等效于 mate 变换 M = I₄、far 为常量标定位姿。
        type: string
        enum:
          - world
      components:
        description: >-
          须归零的位姿分量子集。未指定时默认全部 6 分量 [tx, ty, tz, rx, ry, rz]。
          tx/ty/tz 为平移分量（mm），rx/ry/rz 为 Z-Y-X 欧拉角姿态分量（rad）。
        type: array
        minItems: 1
        maxItems: 6
        uniqueItems: true
        items:
          type: string
          enum:
            - tx
            - ty
            - tz
            - rx
            - ry
            - rz

  scalarOrAngle:
    description: >-
      角度/数值分量：数值按内部约定解释（rad，§8），或带显式单位的字符串
      （如 "45deg"、"0.7854rad"），由 ExecutionConfig 归一化为 rad。
    type: [number, string]

  toolFrameRotation:
    description: >-
      工具坐标系旋转（相对 endFrame），三种等价表示任选其一，与模块定义同构。
      rpy 为 Z-Y-X 内旋欧拉角（§8）；align 为双轴对齐规则（§9.4）。
    oneOf:
      - type: object
        additionalProperties: false
        required: [rpy]
        properties:
          rpy:
            description: Z-Y-X 内旋欧拉角 [Rx, Ry, Rz]。
            type: array
            minItems: 3
            maxItems: 3
            items:
              $ref: "#/$defs/scalarOrAngle"
      - type: object
        additionalProperties: false
        required: [axis_angle]
        properties:
          axis_angle:
            description: 权威表示：轴 omega + 转角 q（Rodrigues，§8）。
            type: object
            additionalProperties: false
            required: [omega, q]
            properties:
              omega:
                description: 单位轴向量。
                type: array
                minItems: 3
                maxItems: 3
                items:
                  type: number
              q:
                $ref: "#/$defs/scalarOrAngle"
      - type: object
        additionalProperties: false
        required: [align]
        properties:
          align:
            description: 双轴对齐规则（§9.4）：a、b 各为 [源轴, 目标轴]，第三轴由右手系唯一推出。
            type: object
            additionalProperties: false
            required: [a, b]
            properties:
              a:
                type: array
                minItems: 2
                maxItems: 2
                items:
                  type: string
                  pattern: "^[+-][XYZ]$"
              b:
                type: array
                minItems: 2
                maxItems: 2
                items:
                  type: string
                  pattern: "^[+-][XYZ]$"

  toolFrame:
    description: >-
      L3 工具坐标系（tool frame）声明：定义工具坐标系相对 endFrame 的固定变换。
      声明后“世界系 ≡ 工具坐标系零位姿态”——初始方向与世界系平行，所有用户面
      目标位姿/位姿报告以工具坐标系表达：
        - 输入（默认左乘世界系增量）：ΔT_internal = U · Δ_tool · U⁻¹
        - 输出：D(q) = U⁻¹ · T_rootWorld(q) · U
      其中 U = T_root←tool = T_root←endFrame · T_endFrame←tool（要求 root→endFrame
      位姿链无关节，即工具刚性固连）。省略本块时行为与历史一致
      （世界系 ≡ 末端参考系零位）。
    type: object
    additionalProperties: false
    required: [transform]
    properties:
      transform:
        description: 工具坐标系相对 endFrame 的固定变换（先平移后旋转，与模块固定变换同构，§8）。
        type: object
        additionalProperties: false
        properties:
          translation:
            description: 平移 [x, y, z]，单位 mm。
            type: array
            minItems: 3
            maxItems: 3
            items:
              type: number
          rotation:
            $ref: "#/$defs/toolFrameRotation"

  tolerances:
    description: 数值求解收敛阈值。
    type: object
    additionalProperties: false
    properties:
      translation_mm:
        description: 平移残差收敛阈值（mm）。
        type: number
        minimum: 0
        default: 0.001
      rotation_rad:
        description: 姿态残差收敛阈值（rad）。
        type: number
        minimum: 0
        default: 0.001

# ---------------------------------------------------------------------------
# 顶层属性
# ---------------------------------------------------------------------------
properties:

  mode:
    $ref: "#/$defs/modeEnum"

  endFrame:
    description: FK 输出 / IK 目标坐标系引用。
    $ref: "#/$defs/portRef"

  world_binding:
    description: >-
      各 ground frame 到 world 的静态标定变换列表。
      每个 ground frame 的偏移由机构零位构型 FK 预计算
      （末端效应器 T=I₄，沿机构传播至 ground frame 的位姿），
      可在条目中省略 T 改由求解器自动标定。
      仅 closed_loop 模式使用，与 anchor: world 切口配合完成 L3 世界系闭合。
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/worldBinding"

  actuated_joints:
    description: >-
      驱动关节列表。每个 ref 指向一个 joint 变量。
      仅 open_loop 模式使用。
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/jointVarRef"

  known:
    description: >-
      已知变量列表（输入）。每个 ref 指向一个变量（joint 变量或 task frame）。
      FK 模式下 joint 变量为 known；IK 模式下目标 frame 为 known。
    type: array
    minItems: 1
    items:
      anyOf:
        - $ref: "#/$defs/jointVarRef"
        - $ref: "#/$defs/portRef"

  unknown:
    description: >-
      未知变量列表（输出）。每个 ref 指向一个变量（joint 变量或 task frame）。
      FK 模式下 task frame 为 unknown；IK 模式下 joint 变量为 unknown。
    type: array
    minItems: 1
    items:
      anyOf:
        - $ref: "#/$defs/jointVarRef"
        - $ref: "#/$defs/portRef"

  closure_cuts:
    description: >-
      闭环切口声明列表。每切口定义 near 与（far 帧对 或 anchor: world）
      以及须归零的位姿分量。仅 closed_loop 模式使用。
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/closureCut"

  tool_frame:
    description: >-
      L3 工具坐标系（可选）。声明后世界系锚定到工具坐标系零位姿态，
      用户面目标位姿在工具坐标系中表达（语义见 $defs/toolFrame）。
      缺省 = 历史行为（世界系 ≡ endFrame 零位）。
    $ref: "#/$defs/toolFrame"

  tolerances:
    description: 数值求解收敛阈值。
    $ref: "#/$defs/tolerances"
